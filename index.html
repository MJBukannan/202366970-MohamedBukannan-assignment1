<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page scale correctly on phones and tablets -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portfolio of Mohamed Bukannan, computer science student at KFUPM.">
  <title>Mohamed Bukannan | Portfolio</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Site header with main navigation -->
  <header class="site-header">
    <a href="#about" class="logo">Mohamed Bukannan</a>
    <nav class="nav">
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- About Me: intro, tagline, profile image -->
    <section id="about" class="section about">
      <h1>About Me</h1>
      <p class="tagline">Tagline goes here.</p>
      <p>Short introduction goes here.</p>
    </section>

    <!-- Projects: one card per project -->
    <section id="projects" class="section projects">
      <h2>Projects</h2>
      <div class="project-grid">
        <article class="project-card">
          <h3>Project One</h3>
          <p>Short description goes here.</p>
        </article>
        <article class="project-card">
          <h3>Project Two</h3>
          <p>Short description goes here.</p>
        </article>
      </div>
    </section>

    <!-- Contact form (front-end only, no backend) -->
    <section id="contact" class="section contact">
      <h2>Contact</h2>
      <form id="contact-form" class="contact-form">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send</button>
      </form>
    </section>

  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Mohamed Bukannan</p>
  </footer>

  <!-- defer: run the script after the HTML has been parsed -->
  <script src="js/script.js" defer></script>
</body>
</html>
